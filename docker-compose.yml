# Локальный Postgres для разработки: docker compose up -d db
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tetris
      POSTGRES_PASSWORD: tetris
      POSTGRES_DB: tetris
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
