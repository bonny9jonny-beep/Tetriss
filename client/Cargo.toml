[package]
name = "fsociety-tetris-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlHeadElement",
  "HtmlCanvasElement", "CanvasRenderingContext2d", "DomTokenList",
  "Storage", "Navigator", "AudioContext", "OscillatorNode",
  "OscillatorType", "GainNode", "AudioParam", "AudioDestinationNode",
  "EventTarget", "KeyboardEvent", "PointerEvent", "TouchEvent",
  "TouchList", "Touch", "MediaQueryList", "NodeList"
] }
